{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
{% endblock %}

{% block content %}

<header class="page-header">
  <h1 class="page-title">ログイン</h1>
  <button id="sidebarToggle" class="toggle-btn" type="button">☰</button>
</header>

{% if error %}
  <p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post" class="auth-form" action="/ui/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
  
  <div class="form-group">
    <label>login_id</label>
    <input name="login_id" required />
  </div>

  <div class="form-group">
    <label>password</label>
    <div class="password-wrapper">
      <input type="password" class="password__input" name="password" required />
      <button type="button" class="password__toggle" aria-label="パスワード表示切替"></button>
    </div>
  </div>

  <p class="text">※ ログイン有効期間は1時間です</p>

  <div class="form-group">
    <button type="submit" class="btn-primary">ログイン</button>
  </div>

</form>
<p style="margin-top:12px;"><a href="/ui/register">新規アカウント登録</a></p>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.password__toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const wrapper = btn.closest('.password-wrapper');
      const input = wrapper.querySelector('input');

      input.type = (input.type === 'password') ? 'text' : 'password';
      btn.classList.toggle('is-visible', input.type === 'text');
    });
  });
});
</script>

{% endblock %}
