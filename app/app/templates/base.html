<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kaneko Ayano App{% endblock %}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <header style="background: white;">
        <a href="/ui/login">Login</a> |
        <a href="/ui/discographies">Discographies</a> |
        <a href="/ui/logs">My Logs</a> |
        <a href="/ui/timeline">Timeline</a> |
        <a href="/ui/logout">Logout</a>
        {% if user and user.is_admin %}
            | <a href="/ui/discographies/new">新規ディスコグラフィ登録</a>
        {% endif %}
    </header>

    <main style="padding: 16px;">
        {% if flash_success %}
            <div class="flash flash-success">{{ flash_success }}</div>
        {% endif %}
        {% if flash_error %}
            <div class="flash flash-error">{{ flash_error }}</div>
        {% endif %}
        {% if flash_info %}
            <div class="flash flash-info">{{ flash_info }}</div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer>
        
    </footer>
</body>
</html>
