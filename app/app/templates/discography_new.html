{% extends "base.html" %}
{% block title %}Add New Discography{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/discographies.css') }}">
{% endblock %}

{% block content %}
<header class="page-header">
  <h1 class="page-title">Add New Discography</h1>
  <button id="sidebarToggle" class="toggle-btn" type="button">☰</button>
</header>

{% if error %}
  <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post" class="form" action="/discographies/new">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-group">
    <label>タイトル</label>
    <input name="discography_title" required />
  </div>

  <div class="form-group">
    <label>種別</label>
    <select name="discography_type" required>
      <option value="">選択してください</option>
      <option value="Album">アルバム</option>
      <option value="Single">シングル</option>
      <option value="EP">EP</option>
      <option value="Movie">映像</option>

    </select>
  </div>

  <div class="form-group">
    <label>発売日</label>
    <input type="date" name="released_date" required />
  </div>

  <div class="form-group">
    <label>再生時間（秒）</label>
    <input type="number" name="playtime_seconds" min="1" />
  </div>

  <div class="form-group">
    <label>曲数</label>
    <input type="number" name="discography_num" min="1" />
  </div>

  <div class="form-group">
    <label>リンク</label>
    <input name="discography_link" />
  </div>

  <div class="form-group">
    <button type="submit" class="edit-btn">登録</button>
  </div>
</form>

<p style="margin-top:12px;">
  <a href="/discographies">一覧へ戻る</a>
</p>
{% endblock %}
