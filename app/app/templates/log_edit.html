{% extends "base.html" %}
{% block title %}ログの編集{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/logs.css') }}">
{% endblock %}

{% block content %}
<header class="page-header">
  <h1 class="page-title">ログ編集</h1>
  <button id="sidebarToggle" class="toggle-btn" type="button">☰</button>
</header>
{% if error %}
  <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post" class="form" action="/ui/logs/{{ log.log_id }}/edit">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-group">
    <label>ディスコグラフィ</label>
    <select name="discography_id" required>
      {% for d in discographies %}
        <option value="{{ d.discography_id }}"
          {% if d.discography_id == log.discography_id %}selected{% endif %}>
          {{ d.discography_title }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label>聴いた日時</label>
    <input
      type="datetime-local"
      name="listened_at"
      required
      value="{{ log.listened_at.strftime('%Y-%m-%dT%H:%M') }}"
    >
  </div>

  <div class="form-group">
    <label>コメント（任意）</label>
    <textarea name="comment" rows="3" maxlength="50">{{ log.comment or '' }}</textarea>
  </div>

  <div class="form-group">
    <button type="submit" class="btn-primary">更新</button>
  </div>
</form>

<form method="post" action="/ui/logs/{{ log.log_id }}/delete"
      onsubmit="return confirm('このログを削除します。よろしいですか？');">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit" class="btn-primary-delete">削除</button>
</form>

<p style="margin-top:12px;">
  <a href="/ui/logs">戻る</a>
</p>

{% endblock %}

</html>
