{% extends "base.html" %}
{% block title %}Add Log{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/logs.css') }}">
{% endblock %}

{% block content %} 
<header class="page-header">
    <h1 class="page-title">Add Log</h1>
    <button id="sidebarToggle" class="toggle-btn" type="button">☰</button>
</header>

<form method="post" class="form" action="/logs/new">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-group">
        <label>ディスコグラフィ</label>
        <select name="discography_id" required>
            <option value="">選択してください</option>
            {% for d in discographies %}
                <option value="{{ d.discography_id }}">
                    {{ d.discography_title }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>聴いた日時</label>
        <input type="datetime-local" name="listened_at" required/>
    </div>

    <div class="form-group">
        <label>コメント（任意）</label>
        <textarea name="comment" rows="3" maxlength="50"></textarea>
    </div>

    <div class="form-group">
        <button type="submit" class="btn-primary">保存</button>
    </div>
</form>
<p style="margin-top:12px;">
    <a href="/logs">ログ一覧へ戻る</a>
</p>
{% endblock %}
