{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
{% endblock %}

{% block content %}
<header class="page-header">
    <h1 class="page-title">アカウント編集</h1>
    <button id="sidebarToggle" class="toggle-btn" type="button">☰</button>
</header>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<p>ログイン中: {{ user.display_name }} @{{ user.login_id }}</p>

<!-- プロフィール更新 -->
<form method="post" class="auth-form" action="/ui/account/profile">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

    <div class="form-group">
        <label>login_id<span class="required">*</span></label>
        <input name="login_id" placeholder="12文字以内の半角英数字（必須）" required />
    </div>

    <div class="form-group">
        <label>display_name</label>
        <input name="display_name" placeholder="12文字以内（任意）"/>
    </div>

    <div class="form-group">
        <button type="submit" class="btn-primary">プロフィール更新</button>
    </div>

</form>

<!-- パスワード更新 -->
<form method="post" class="auth-form" action="/ui/account/password" style="margin-top: 24px";>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-group">
        <label>現在のパスワード<span class="required">*</span></label>
        <input type="password" name="current_password" placeholder="現在のパスワード" required/>
    </div>

    <div class="form-group">
        <label>新しいパスワード<span class="required">*</span></label>
        <input type="password" name="new_password" placeholder="8文字以上の半角英数字・記号（必須）" required/>
    </div>

    <div class="form-group">
        <label>新しいパスワード（確認用）<span class="required">*</span></label>
        <input type="password" name="new_password_confirm" placeholder="上記と同じパスワードを入力">
    </div>

    <div class="form-group">
        <button type="submit" class="btn-primary">パスワード更新</button>
    </div>
</form>


<p style="margin-top:12px;">
    <a href="/ui/logs">ログ一覧へ戻る</a>
</p>

{% endblock %}
