{% extends "base.html" %}
{% block title %}Discography 登録{% endblock %}

{% block content %}
<header class="page-header">
  <h1 class="page-title">新規ディスコグラフィ登録</h1>
  <button id="sidebarToggle" class="toggle-btn" type="button">☰</button>
</header>

{% if error %}
  <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post" action="/ui/discographies/new">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div>
    <label>タイトル</label><br />
    <input name="discography_title" required />
  </div>

  <div style="margin-top:8px;">
    <label>種別</label><br />
    <select name="discography_type" required>
      <option value="">選択してください</option>
      <option value="Album">アルバム</option>
      <option value="Single">シングル</option>
      <option value="EP">EP</option>
      <option value="Movie">映像</option>

    </select>
  </div>

  <div style="margin-top:8px;">
    <label>発売日</label><br />
    <input type="date" name="released_date" required />
  </div>

  <div style="margin-top:8px;">
    <label>再生時間（秒）</label><br />
    <input type="number" name="playtime_seconds" min="1" />
  </div>

  <div style="margin-top:8px;">
    <label>曲数</label><br />
    <input type="number" name="discography_num" min="1" />
  </div>

  <div style="margin-top:12px;">
    <button type="submit">登録</button>
  </div>
</form>

<p style="margin-top:12px;">
  <a href="/ui/discographies">一覧へ戻る</a>
</p>
{% endblock %}
