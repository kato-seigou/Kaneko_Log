{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
{% endblock %}

{% block content %}
<header class="page-header">
  <h1 class="page-title">新規アカウント登録</h1>
  <button id="sidebarToggle" class="toggle-btn" type="button">☰</button>
</header>

{% if error %}
  <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post" class="auth-form" action="/ui/register">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

  <div class="form-group">
    <label>login_id<span class="required">*</span></label>
    <input name="login_id" placeholder="12文字以内の半角英数字（必須）" required />
  </div>

  <div class="form-group">
    <label>display_name</label>
    <input name="display_name" placeholder="12文字以内（任意）"/>
  </div>

  <div class="form-group">
    <label>password<span class="required">*</span></label>
    <input type="password" name="password" placeholder="12文字以内の半角英数字・記号（必須）" required />
  </div>

  <div class="form-group">
    <label>password（確認用）<span class="required">*</span></label>
    <input type="password" name="password_confirm" placeholder="上記と同じパスワードを入力"required />
  </div>

  <div class="form-group">
    <button type="submit" class="btn-primary">登録</button>
  </div>

</form>
<p style="margin-top:12px;"><a href="/ui/login">ログインへ戻る</a></p>
{% endblock %}
