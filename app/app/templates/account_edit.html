{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
{% endblock %}

{% block content %}
<header class="page-header">
    <h1 class="page-title">アカウント編集</h1>
    <button id="sidebarToggle" class="toggle-btn" type="button">☰</button>
</header>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<p>ログイン中: {{ user.display_name }} @{{ user.login_id }}</p>

<!-- プロフィール更新 -->
<form method="post" class="auth-form" action="/ui/account/profile">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

    <div class="form-group">
        <label>login_id<span class="required">*</span></label>
        <input name="login_id" placeholder="12文字以内の半角英数字（必須）" required />
    </div>

    <div class="form-group">
        <label>display_name</label>
        <input name="display_name" placeholder="12文字以内（任意）"/>
    </div>

    <div class="form-group">
        <button type="submit" class="btn-primary">プロフィール更新</button>
    </div>

</form>

<!-- パスワード更新 -->
<form method="post" class="auth-form" action="/ui/account/password" style="margin-top: 24px";>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-group">
        <label>現在のパスワード<span class="required">*</span></label>
        <div class="password-wrapper">
            <input type="password" class="password__input" name="current_password" placeholder="現在のパスワード" required/>
            <button type="button" class="password__toggle" aria-label="パスワード表示切替"></button>
        </div>
    </div>

    <div class="form-group">
        <label>新しいパスワード<span class="required">*</span></label>
        <div class="password-wrapper">
            <input type="password" class="password__input" name="new_password" placeholder="8文字以上の半角英数字・記号（必須）" required/>
            <button type="button" class="password__toggle" aria-label="パスワード表示切替"></button>
        </div>
    </div>

    <div class="form-group">
        <label>新しいパスワード（確認用）<span class="required">*</span></label>
        <div class="password-wrapper">
            <input type="password" class="password__input" name="new_password_confirm" placeholder="上記と同じパスワードを入力">
            <button type="button" class="password__toggle" aria-label="パスワード表示切替"></button>
        </div>
    </div>

    <div class="form-group">
        <button type="submit" class="btn-primary">パスワード更新</button>
    </div>
</form>

<p style="margin-top:12px;">
    <a href="/ui/logs">ログ一覧へ戻る</a>
</p>

<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.password__toggle').forEach((btn) => {
        btn.addEventListener('click', () => {
        const wrapper = btn.closest('.password-wrapper');
        const input = wrapper.querySelector('input');

        input.type = (input.type === 'password') ? 'text' : 'password';
        btn.classList.toggle('is-visible', input.type === 'text');
        });
    });
    });
</script>

{% endblock %}
