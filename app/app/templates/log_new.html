{% extends "base.html" %}
{% block title %}新規ログ作成{% endblock %}
{% block content %} 
<h1>新規ログ作成</h1>

<form method="post" action="/ui/logs/new">
    <input type="hidden", name="csrf_token" value="{{ csrf_token }}">
    <div>
        <label>discography title</label><br />
        <select name="discography_id" required>
            <option value="">選択してください</option>
            {% for d in discographies %}
                <option value="{{ d.discography_id }}">
                    {{ d.discography_title }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-top:8px;">
        <label>listened_at</label><br />
        <input type="datetime-local" name="listened_at" 
        max="{{ now.strftime('%Y-%m-%dT%H:%M') }}" required/>
    </div>

    <div style="margin-top:8px;">
        <label>comment</label><br />
        <textarea name="comment" rows="3" maxlength="50"></textarea>
    </div>

    <div style="margin-top:12px;">
        <button type="submit">保存</button>
    </div>
</form>
<p style="margin-top:12px;">
    <a href="/ui/logs">一覧へ戻る</a>
</p>
{% endblock %}
